<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Office Chaos: Warzone Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; background: #0a0a0a; color: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100vh; touch-action: none; }
        
        #lobbyOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #2a2a2a, #000); z-index: 200; display: flex; justify-content: center; align-items: center; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .lobby-card { background: rgba(20,20,20,0.95); border: 2px solid #ffcc00; border-radius: 12px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 20px; }
        .lobby-title { text-align: center; margin: 0; color: #ffcc00; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        
        .setup-section { display: flex; flex-direction: column; gap: 10px; }
        .setup-section label { font-size: 12px; color: #aaa; font-weight: bold; text-transform: uppercase; }
        .input-text { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; font-size: 14px; outline: none; box-sizing: border-box; }
        
        .color-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
        .color-btn { width: 100%; aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
        .color-btn.selected { border-color: #fff; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        .weapon-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .weapon-btn { background: #222; border: 1px solid #444; border-radius: 6px; padding: 10px; cursor: pointer; color: #ccc; font-size: 12px; text-align: center; transition: 0.2s; font-weight: bold; }
        .weapon-btn.selected { background: rgba(255,204,0,0.2); border-color: #ffcc00; color: #ffcc00; }
        
        .preview-container { display: flex; align-items: center; justify-content: center; gap: 20px; background: #111; border-radius: 8px; padding: 15px; border: 1px solid #333; }
        canvas#previewCanvas { width: 80px; height: 80px; background: #1a1a1a; border-radius: 8px; border: 1px solid #444; }
        .lobby-actions { display: flex; gap: 10px; }
        .btn-main, .btn-alt { flex: 1; padding: 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-main { background: #ffcc00; color: #000; } .btn-main:hover { background: #e6b800; transform: translateY(-2px); }
        .btn-alt { background: #3498db; color: #fff; } .btn-alt:hover { background: #2980b9; transform: translateY(-2px); }

        #ui { width: 100%; background: rgba(15,15,15,0.95); padding: 10px 0; text-align: center; border-bottom: 2px solid #ffcc00; z-index: 10; display: none; }
        #gameActive { color: #ccc; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap;}
        .exit-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;}

        #mainContainer { display: none; gap: 20px; align-items: flex-start; justify-content: center; margin-top: 15px; width: 95%; max-width: 1140px; }
        .canvas-wrapper { position: relative; width: 100%; max-width: 900px; }
        canvas#gameCanvas { width: 100%; height: auto; aspect-ratio: 900 / 550; border: 2px solid #333; cursor: crosshair; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background: #111; border-radius: 8px; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; border-radius: 8px; }
        #killfeed { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; }
        .kf-item { background: rgba(20,20,20,0.8); padding: 4px 8px; margin-bottom: 4px; font-size: 11px; border-radius: 3px; border-left: 2px solid #ff4444; }
        
        #topHUD { position: absolute; top: 10px; left: 10px; display: flex; gap: 10px; pointer-events: none; }
        .hud-box { background: rgba(20,20,20,0.9); border: 1px solid #ffcc00; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 14px; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.8); }

        #sidePanel { background: rgba(15,15,15,0.9); border: 2px solid #333; border-radius: 8px; padding: 12px; width: 220px; height: 100%; min-height: 400px; display: flex; flex-direction: column; box-sizing: border-box; }
        #sidePanel h3 { margin: 0 0 10px 0; color: #ffcc00; font-size: 13px; text-align: center; border-bottom: 1px solid #444; padding-bottom: 8px; }
        #scoreList { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; }
        .team-score { background: rgba(255,255,255,0.05); padding: 6px; margin-bottom: 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: flex; justify-content: space-between;}
        .lb-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 4px; padding: 4px 8px; background: rgba(255,255,255,0.02); border-radius: 4px; }
        .lb-dead { opacity: 0.4; text-decoration: line-through; }
        .kick-btn { background: #ff4444; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 10px; padding: 2px 6px; margin-left: 5px; display: none; }

        #chatBox { display: flex; flex-direction: column; height: 150px; background: rgba(0,0,0,0.5); border-radius: 4px; border: 1px solid #444; pointer-events: auto; }
        #chatMessages { flex-grow: 1; overflow-y: auto; padding: 5px; font-size: 11px; display: flex; flex-direction: column; gap: 3px; word-wrap: break-word; }
        .chat-msg { background: rgba(255,255,255,0.1); padding: 4px; border-radius: 3px; }
        #chatInput { width: 100%; border: none; border-top: 1px solid #444; background: rgba(20,20,20,0.9); color: white; padding: 8px; box-sizing: border-box; font-size: 11px; outline: none; border-radius: 0 0 4px 4px; }
        #chatInput:focus { background: #000; border-top-color: #ffcc00; }

        #shopModal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,15,15,0.98); border: 2px solid #3498db; border-radius: 8px; padding: 20px; width: 320px; z-index: 150; display: none; box-shadow: 0 0 30px rgba(0,0,0,0.9); }
        #shopModal h2 { margin: 0 0 10px 0; color: #3498db; text-align: center; border-bottom: 1px solid #444; padding-bottom: 5px; font-size: 18px; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .shop-btn { background: #222; border: 1px solid #555; border-radius: 6px; padding: 12px 5px; color: #fff; cursor: pointer; transition: 0.2s; font-weight: bold; font-size: 12px; }
        .shop-btn:hover { background: #333; border-color: #3498db; }
        .shop-btn.disabled { opacity: 0.5; cursor: not-allowed; border-color: #444 !important; }

        #hostToggleBtn { position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: #ffcc00; color: #000; font-size: 22px; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 60; display: none; }
        #hostSettings { position: fixed; bottom: 75px; right: 20px; background: rgba(0,0,0,0.95); padding: 15px; border-radius: 8px; border: 1px solid #ffcc00; width: 200px; font-size: 11px; display: none; z-index: 55; box-shadow: 0 5px 15px rgba(0,0,0,0.7); }
        #hostSettings label { display: block; margin-top: 8px; color: #aaa; font-weight: bold; }
        #hostSettings select { width: 100%; margin-top: 4px; padding: 4px; background:#222; color:#fff; border:1px solid #555; }
        #hostSettings button { padding: 8px; background: #ffcc00; color: #000; border: none; width: 100%; margin-top: 10px; cursor: pointer; font-weight:bold; }

        #hofModal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15,15,15,0.95); border: 2px solid #ffcc00; border-radius: 8px; padding: 20px; width: 300px; z-index: 200; display: none; }
        .hof-row { display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid #333; font-size: 13px; }
        .close-btn { background: #ff4444; color:#fff; width: 100%; margin-top: 15px; padding: 8px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;}

        #msgOverlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,0,0,0.9); color: white; padding: 15px 25px; border-radius: 5px; font-weight: bold; display: none; z-index: 250; text-align: center; }
        
        #mobileControls { position: fixed; bottom: 15px; left: 0; width: 100%; height: 110px; display: none; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 50; pointer-events: none; }
        .joystick-zone { width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; position: relative; pointer-events: auto; }
        .joystick-knob { width: 36px; height: 36px; background: rgba(255,204,0,0.7); border-radius: 50%; position: absolute; top: 32px; left: 32px; pointer-events: none; }
        #mobileReactions { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); display: none; flex-direction: row; gap: 15px; z-index: 50; }
        .react-btn { background: rgba(0,0,0,0.6); border: 1px solid #ffcc00; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; pointer-events: auto;}

        .hidden { display: none !important; }
        
        @media (max-width: 900px) { 
            .color-grid { grid-template-columns: repeat(5, 1fr); }
            #mainContainer { flex-direction: column; align-items: center; margin-top: 5px; gap: 10px; } 
            .canvas-wrapper { width: 95%; } 
            #sidePanel { width: 95%; height: auto; min-height: unset; max-height: 200px; flex-direction: row; gap: 10px; padding: 8px; } 
            #scoreList { width: 50%; margin: 0; } 
            #chatBox { width: 50%; height: 100%; display: flex; } 
        }
    </style>
</head>
<body>

    <div id="lobbyOverlay">
        <div class="lobby-card">
            <h1 class="lobby-title">Office Chaos</h1>
            <div class="setup-section"><label>Tu Nombre</label><input type="text" id="userName" class="input-text" placeholder="Ej: Lucas" maxlength="10"></div>
            <div class="setup-section"><label>Color de Personaje</label><div class="color-grid" id="colorGrid"></div></div>
            <div class="setup-section">
                <label>Elige tu Arma Base</label>
                <div class="weapon-grid">
                    <div class="weapon-btn selected" onclick="selectWeapon('pistol', this)">Pistola<br><span style="font-size:10px; font-weight:normal;">Rápida | 25 Dmg</span></div>
                    <div class="weapon-btn" onclick="selectWeapon('shotgun', this)">Escopeta<br><span style="font-size:10px; font-weight:normal;">3 Balas | 25x3 Dmg</span></div>
                    <div class="weapon-btn" onclick="selectWeapon('sniper', this)">Sniper<br><span style="font-size:10px; font-weight:normal;">Atraviesa | 100 Dmg</span></div>
                    <div class="weapon-btn" onclick="selectWeapon('mg', this)">Metralleta<br><span style="font-size:10px; font-weight:normal;">Ráfaga | 8 Dmg</span></div>
                </div>
            </div>
            <div class="preview-container">
                <div style="flex:1;"><label style="font-size:12px; color:#aaa; font-weight:bold;">PREVIEW:</label></div>
                <canvas id="previewCanvas" width="80" height="80"></canvas>
            </div>
            <div class="setup-section"><label>ID de la Sala</label><input type="text" id="customId" class="input-text" placeholder="Ej: B2B" maxlength="8" style="text-transform: uppercase;"></div>
            <div class="lobby-actions"><button class="btn-main" onclick="startLogin()">Entrar</button><button class="btn-alt" onclick="showHallOfFame()">Histórico</button></div>
        </div>
    </div>

    <div id="ui">
        <div id="gameActive">
            🔴 SALA: <b id="displayId" style="color: #ffcc00;">-</b> 
            &nbsp;|&nbsp; 🗺️ <span id="mapName">-</span> 
            &nbsp;|&nbsp; 🛒 'B' Tienda 
            &nbsp;|&nbsp; ⌨️ 'P' Chat
            <button class="exit-btn" onclick="exitGame()">🚪 SALIR</button>
        </div>
    </div>

    <div id="shopModal">
        <h2>🛒 DISTRI-SHOP</h2>
        <p style="text-align:center; margin:0; color:#aaa;">Tienes: <strong id="shopCoinDisplay" style="color:#ffcc00; font-size:16px;">0</strong> Coins</p>
        <div class="shop-grid">
            <button class="shop-btn" onclick="buyItem('shotgun', 40)">🔫 Escopeta (40)</button>
            <button class="shop-btn" onclick="buyItem('sniper', 40)">🎯 Sniper (40)</button>
            <button class="shop-btn" onclick="buyItem('mg', 40)">🧨 Metralleta (40)</button>
            <button class="shop-btn" onclick="buyItem('shield', 20)">🛡️ Escudo (20)</button>
            <button class="shop-btn" onclick="buyItem('heal', 20)" style="grid-column: span 2;">💊 Curar Vida (20)</button>
        </div>
        <button class="close-btn" onclick="toggleShop()">CERRAR</button>
    </div>

    <div id="msgOverlay">Conectando...</div>

    <button id="hostToggleBtn" onclick="toggleHostPanel()">⚙️</button>
    <div id="hostSettings">
        <h4 style="margin:0 0 5px 0; color:#ffcc00; text-align:center;">PANEL ADMIN</h4>
        <label>Modo de Juego:</label><select id="cfgMode"><option value="ffa" selected>Todos vs Todos</option><option value="teams">Equipos (Por Color)</option><option value="juggernaut">Jefe Zombi</option></select>
        <label>Mapa:</label><select id="cfgMap"><option value="0">Arena Vacía</option><option value="1" selected>Oficina</option><option value="2">Depósito</option></select>
        <label>Velocidad Mov.:</label><select id="cfgMove"><option value="3">Lento</option><option value="5" selected>Normal</option><option value="8">Rápido</option></select>
        <label>Zona:</label><select id="cfgZone"><option value="0">Apagada</option><option value="0.08" selected>Lenta</option><option value="0.2">Rápida</option></select>
        <button onclick="applySettings()">APLICAR Y REINICIAR</button>
    </div>

    <div id="hofModal"><h2 style="color:#ffcc00;">📊 REPORTE (KILLS)</h2><div id="hofContent">Cargando...</div><button class="close-btn" onclick="document.getElementById('hofModal').style.display='none'">CERRAR</button></div>

    <div id="mainContainer">
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="hud">
                <div id="topHUD"><div class="hud-box" id="inGameCoins">💰 0 Coins</div></div>
                <div id="killfeed"></div>
            </div>
        </div>
        <div id="sidePanel">
            <h3 id="lbTitle">🏆 RANKING</h3>
            <div id="scoreList"></div>
            <div id="chatBox"><div id="chatMessages"></div><input type="text" id="chatInput" placeholder="Escribir (Tecla P)..." maxlength="40"></div>
        </div>
    </div>

    <div id="mobileControls"><div class="joystick-zone" id="joyLeft"><div class="joystick-knob" id="knobLeft"></div></div><div class="joystick-zone" id="joyRight"><div class="joystick-knob" id="knobRight"></div></div></div>
    <div id="mobileReactions">
        <button class="react-btn" onclick="sendReaction('🤬')">🤬</button><button class="react-btn" onclick="sendReaction('😂')">😂</button>
        <button class="react-btn" onclick="sendReaction('💀')">💀</button><button class="react-btn" style="background:#3498db; border-color:#fff;" onclick="toggleShop()">🛒</button>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE FIREBASE E IMÁGENES
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDxMYI0Q0ICvf7XM-VxMIs08wqaOTSOxBY",
            authDomain: "caos-oficina.firebaseapp.com",
            databaseURL: "https://caos-oficina-default-rtdb.firebaseio.com",
            projectId: "caos-oficina",
            storageBucket: "caos-oficina.firebasestorage.app",
            messagingSenderId: "301553196610",
            appId: "1:301553196610:web:53ab5522faf64b255117db"
        };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();

        // IMÁGENES CARGADAS
        const bgOfficeImg = new Image(); bgOfficeImg.src = 'https://i.imgur.com/jjGq36r.jpeg';
        const coinFront = new Image(); coinFront.src = 'https://i.imgur.com/uWaYS9e.jpeg'; 
        const coinBack = new Image();  coinBack.src = 'https://i.imgur.com/12OIdW8.jpeg';   

        // ==========================================
        // 2. LOBBY Y PREVIEW
        // ==========================================
        const palette = ["#ff4757", "#ff7f50", "#ffa502", "#eccc68", "#2ed573", "#7bed9f", "#1e90ff", "#70a1ff", "#5352ed", "#3742fa", "#9b59b6", "#8e44ad", "#ff6b81", "#ff4d4d", "#c56cf0", "#ffb8b8", "#32ff7e", "#18dcff", "#00d8d6", "#f1f2f6"];
        let myColor = palette[0], myWeapon = 'pistol';
        
        const cGrid = document.getElementById('colorGrid');
        palette.forEach((c, i) => {
            let btn = document.createElement('div'); btn.className = 'color-btn' + (i===0?' selected':''); btn.style.background = c;
            btn.onclick = () => { document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); myColor = c; drawPreview(); };
            cGrid.appendChild(btn);
        });

        function selectWeapon(w, el) { document.querySelectorAll('.weapon-btn').forEach(b=>b.classList.remove('selected')); el.classList.add('selected'); myWeapon = w; drawPreview(); }

        const pCanvas = document.getElementById('previewCanvas'); const pCtx = pCanvas.getContext('2d');
        function drawPreview() {
            pCtx.clearRect(0,0,80,80); pCtx.save(); pCtx.translate(40,40); pCtx.rotate(-Math.PI/4);
            pCtx.beginPath(); pCtx.arc(0,0,16,0,Math.PI*2); pCtx.fillStyle = myColor; pCtx.fill(); pCtx.strokeStyle="#000"; pCtx.lineWidth=2; pCtx.stroke();
            pCtx.fillStyle = "#fff";
            if(myWeapon === 'sniper') pCtx.fillRect(14, -3, 20, 6);
            else if(myWeapon === 'shotgun') { pCtx.fillRect(14, -6, 12, 4); pCtx.fillRect(14, 2, 12, 4); }
            else if(myWeapon === 'mg') { pCtx.fillRect(14, -4, 15, 8); pCtx.fillStyle="#555"; pCtx.fillRect(18, -6, 6, 12); }
            else pCtx.fillRect(14, -3, 8, 6); 
            pCtx.restore();
        }
        drawPreview();

        // ==========================================
        // 3. GLOBALES DE JUEGO Y MAPAS
        // ==========================================
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); canvas.width = 900; canvas.height = 550;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        let isSuperAdmin = false, hostInterval, renderReq, inputInterval;
        let lastDrawTime = 0; // Control de FPS
        function toggleHostPanel() { const p = document.getElementById('hostSettings'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }

        const mapList = [
            { name: "Arena Vacía", bg: "#1a1a1a", wall: "#444", furniture: [], hazards: [] },
            { name: "Oficina Distrinando", bg: "#e0e0e0", wall: "rgba(0,0,0,0)", furniture: [ {x: 100, y: 60, w: 210, h: 120}, {x: 170, y: 250, w: 140, h: 130}, {x: 170, y: 430, w: 140, h: 120}, {x: 10, y: 350, w: 120, h: 110}, {x: 420, y: 70, w: 40, h: 450}, {x: 610, y: 160, w: 120, h: 260}, {x: 10, y: 140, w: 40, h: 40}, {x: 360, y: 150, w: 40, h: 40}, {x: 360, y: 490, w: 40, h: 40}, {x: 840, y: 150, w: 40, h: 40}, {x: 840, y: 490, w: 40, h: 40} ], hazards: [] },
            { name: "Depósito Distrinando", bg: "#263238", wall: "#cfd8dc", furniture: [{x:80, y:80, w:60, h:380}, {x:760, y:80, w:60, h:380}, {x:300, y:150, w:100, h:100}], hazards: [{type:'belt', x:430, y:100, w:40, h:350, dx:0, dy:2}] }
        ];

        let myId = "usr_" + Math.random().toString(36).substr(2, 9);
        let roomId = "", isHost = false, roomRef = null;
        let localPlayers = {}, bullets = [], boosters = [], particles = [], killfeedData = [], zoneSize = 0;
        let lastShot = 0, mouseX = 450, mouseY = 275, isShooting = false;
        let config = { mapIdx: 1, mode: 'ffa', zoneSpeed: 0.08, moveSpeed: 5, bossId: null };

        const wpStats = { 'pistol': { cd: 400, dmg: 25, spd: 15, size: 4 }, 'shotgun': { cd: 1200, dmg: 25, spd: 12, size: 3 }, 'sniper': { cd: 2000, dmg: 100, spd: 25, size: 6, pen: true }, 'mg': { cd: 120, dmg: 8, spd: 18, size: 3 } };
        let mgHeat = 0, mgOverheated = false;

        function showMsg(txt, duration = 3000) { const m = document.getElementById('msgOverlay'); m.innerHTML = txt; m.style.display = 'block'; if(duration) setTimeout(() => m.style.display = 'none', duration); }

        function showHallOfFame() {
            const modal = document.getElementById('hofModal'); const content = document.getElementById('hofContent');
            modal.style.display = 'block'; content.innerHTML = "Cargando datos...";
            db.ref('hallOfFame').orderByChild('kills').limitToLast(10).once('value', snap => {
                if(!snap.exists()) { content.innerHTML = "Todavía no hay ventas registradas."; return; }
                let data = []; snap.forEach(c => { data.push({name: c.key, kills: c.val().kills, color: c.val().color}); });
                data.reverse(); let html = "";
                data.forEach((d, i) => { html += `<div class="hof-row"><span style="color:${d.color}">#${i+1} ${d.name}</span><span>${d.kills} Kills</span></div>`; });
                content.innerHTML = html;
            });
        }

        // ==========================================
        // 4. TIENDA DE MONEDAS
        // ==========================================
        function toggleShop() {
            let m = document.getElementById('shopModal'); 
            if(m.style.display === 'block') { m.style.display = 'none'; return; }
            m.style.display = 'block';
            let myCoins = (localPlayers[myId] && localPlayers[myId].coins) || 0;
            document.getElementById('shopCoinDisplay').innerText = myCoins;
            document.querySelectorAll('.shop-btn').forEach(b => {
                let cost = parseInt(b.innerText.match(/\((\d+)\)/)[1]);
                if(myCoins < cost) b.classList.add('disabled'); else b.classList.remove('disabled');
            });
        }

        function buyItem(type, cost) {
            let me = localPlayers[myId]; if(!me || me.dead || me.coins < cost) return;
            roomRef.child('players/'+myId+'/coins').set(me.coins - cost);

        // ==========================================

        // ==========================================
        // 6. LÓGICAS GLOBALES Y COLISIONES STRICTAS
        // ==========================================
        
        // Colisión estándar (Circular vs Rectángulo) - Usada para el movimiento
        function checkCollision(x, y, radius) { 
            let map = mapList[config.mapIdx] || mapList[1];
            return map.furniture.some(f => { let tx = x, ty = y; if (x < f.x) tx = f.x; else if (x > f.x + f.w) tx = f.x + f.w; if (y < f.y) ty = f.y; else if (y > f.y + f.h) ty = f.y + f.h; return ((x - tx)*(x - tx) + (y - ty)*(y - ty)) <= (radius*radius); }); 
        }

        // ALGORITMO CAJA ESTRICTA PARA EL SPAWN - Garantiza no nacer dentro de muebles
        function getSafeSpawn(isBoss = false) { 
            let x, y, isSafe = false, att = 0; 
            let checkRad = isBoss ? 35 : 25; // Margen gigante
            let map = mapList[config.mapIdx] || mapList[1];

            while(!isSafe && att < 1000) { 
                x = Math.random()*(canvas.width - 100) + 50; 
                y = Math.random()*(canvas.height - 100) + 50; 
                isSafe = true;
                for(let i=0; i<map.furniture.length; i++) {
                    let f = map.furniture[i];
                    if (x > f.x - checkRad && x < f.x + f.w + checkRad && y > f.y - checkRad && y < f.y + f.h + checkRad) {
                        isSafe = false; break;
                    }
                }
                att++; 
            } 
            if(!isSafe) { x = 450; y = 275; } // Fallback centro
            return {x, y}; 
        }

        function resetPlayer(id) { 
            let p = localPlayers[id]; if(!p) return;
            let isBoss = (config.mode === 'juggernaut' && config.bossId === id);

            let pData = { dead: false, shield: false, speedBoost: 0, weapon: isBoss ? 'boss' : p.baseWeapon, x: s.x, y: s.y, targetX: s.x, targetY: s.y, hp: isBoss ? 500 : 100, maxHp: isBoss ? 500 : 100, radius: isBoss ? 22 : 12, isBoss: isBoss };
            
            if(id === myId) { 
                p.x = s.x; p.y = s.y; p.dbX = s.x; p.dbY = s.y; 
                mouseX = s.x; mouseY = s.y; // Anclamos el mouse al nuevo spawn para evitar tirones
                roomRef.child('players/' + myId).update(pData); 
            } else if (isHost || isSuperAdmin) {
                roomRef.child('players/' + id).update(pData);
            }
        }

        function sendChat() { let input = document.getElementById('chatInput'); let txt = input.value.trim(); if(!txt) return; roomRef.child('chat').push({ sender: localPlayers[myId].name, color: localPlayers[myId].color, text: txt }); input.value = ''; input.blur(); }
        function renderChat(sender, color, text) { const box = document.getElementById('chatMessages'); box.innerHTML += `<div class="chat-msg"><b style="color:${color}">${sender}:</b> ${text}</div>`; box.scrollTop = box.scrollHeight; }

        window.addEventListener('keydown', e => {

            if(e.key === '1') sendReaction('🤬'); if(e.key === '2') sendReaction('😂'); if(e.key === '3') sendReaction('💀'); if(e.key === '4') sendReaction('🏳️'); 
        });

        if(!isMobile) { window.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouseX = (e.clientX - r.left) * (canvas.width / r.width); mouseY = (e.clientY - r.top) * (canvas.height / r.height); }); window.addEventListener('mousedown', () => isShooting = true); window.addEventListener('mouseup', () => isShooting = false); window.addEventListener('mouseleave', () => isShooting = false); }

        function setupJoystick(zoneId, knobId, isAim) {
            const zone = document.getElementById(zoneId); const knob = document.getElementById(knobId); let active = false, center = {x:0, y:0};
            zone.addEventListener('touchstart', e => { active = true; const r = zone.getBoundingClientRect(); center = {x: r.left + r.width/2, y: r.top + r.height/2}; handleMove(e.touches[0]); });
            zone.addEventListener('touchmove', e => { if(active) handleMove(e.touches[0]); });
            zone.addEventListener('touchend', () => { active = false; knob.style.transform = `translate(0px, 0px)`; if(isAim) isShooting = false; else if(localPlayers[myId]) { roomRef.child('players/'+myId).update({targetX: localPlayers[myId].x, targetY: localPlayers[myId].y}); }});
            function handleMove(touch) { 
                let dx = touch.clientX - center.x, dy = touch.clientY - center.y, dist = Math.hypot(dx, dy), maxDist = 30; 
                if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; } knob.style.transform = `translate(${dx}px, ${dy}px)`; 
                if(localPlayers[myId] && !localPlayers[myId].dead) { 
                    if(isAim) { mouseX = localPlayers[myId].x + dx * 8; mouseY = localPlayers[myId].y + dy * 8; isShooting = dist > 10; } 
                    else { roomRef.child('players/'+myId).update({targetX: localPlayers[myId].x + dx * 2.5, targetY: localPlayers[myId].y + dy * 2.5}); } 
                } 
            }
        }
        if(isMobile) { setupJoystick('joyLeft', 'knobLeft', false); setupJoystick('joyRight', 'knobRight', true); }

        function createExplosion(x, y, color) { let p = []; for(let i=0; i<35; i++) p.push({x, y, vx:(Math.random()-0.5)*15, vy:(Math.random()-0.5)*15, life:1, color}); return p; }
        function addKillfeed(killer, victim, color) { killfeedData.push({ text: `<span style="color:${color}">${killer}</span> 🔫 ${victim}`, expire: Date.now() + 4000 }); }

        function updateLeaderboard() {
            let html = ""; let title = config.mode === 'teams' ? "🏆 EQUIPOS (COLOR)" : (config.mode === 'juggernaut' ? "🧟 JEFE ZOMBI" : "🏆 TODOS VS TODOS");
            document.getElementById('lbTitle').innerText = title;
            if(config.mode === 'teams') {
                let teams = {}; Object.values(localPlayers).forEach(p => { if(!teams[p.color]) teams[p.color]=0; teams[p.color] += p.score; });
                Object.keys(teams).sort((a,b) => teams[b] - teams[a]).forEach(c => {
                    html += `<div class="team-score" style="color:${c}; border-left:3px solid ${c};"><span>Equipo</span><span>${teams[c]} pts</span></div>`;
                    Object.entries(localPlayers).filter(([id,p]) => p.color === c).sort((a,b) => b[1].score - a[1].score).forEach(([id,p]) => { 
                        let kick = isSuperAdmin && id !== myId ? `<button class="kick-btn" style="display:inline-block" onclick="kickPlayer('${id}')">X</button>` : '';
                        html += `<div class="lb-row ${p.dead?'lb-dead':''}"><span style="overflow:hidden; text-overflow:ellipsis;">${p.name}</span><div>${p.score}${kick}</div></div>`; 
                    });
                });
            } else { 
                Object.entries(localPlayers).sort((a,b) => b[1].score - a[1].score).forEach(([id,p], i) => { 
                    let icon = p.isBoss ? "🧟" : (i === 0 && p.score > 0 ? "👑" : ""); 
                    let kick = isSuperAdmin && id !== myId ? `<button class="kick-btn" style="display:inline-block" onclick="kickPlayer('${id}')">X</button>` : '';
                    html += `<div class="lb-row ${p.dead?'lb-dead':''}"><span style="color:${p.isBoss ? '#ff4444' : p.color};">■ ${icon} ${p.name}</span><div>${p.score}${kick}</div></div>`; 
                }); 
            }
            document.getElementById('scoreList').innerHTML = html;
        }

        // ==========================================
        // 7. MOTOR HOST (Físicas y Drop de Monedas)
        // ==========================================
        function hostSyncLoop() {
            if(!isHost || !localPlayers) return;
            let currentExplosions = null, killData = null; zoneSize += config.zoneSpeed;

            if(Math.random() < 0.05 && boosters.length < 6) { let bx = Math.random()*(canvas.width-100)+50, by = Math.random()*(canvas.height-100)+50; if(!checkCollision(bx, by, 15)) boosters.push({x: bx, y: by, type: ['🛡️', '☕', '💊'][Math.floor(Math.random()*3)]}); }

            for(let id in localPlayers) {
                let p = localPlayers[id];
                if(p.shootAngle !== null && p.shootAngle !== undefined && !p.dead) {
                    let a = p.shootAngle; let stats = wpStats[p.weapon] || wpStats['pistol'];
                    if(p.weapon === 'shotgun') { [-0.2, 0, 0.2].forEach(off => bullets.push({x: p.x, y: p.y, angle: a + off, owner: id, color: p.color, speed: stats.spd, size: stats.size, damage: stats.dmg})); } 
                    else if (p.weapon === 'boss') { bullets.push({x: p.x, y: p.y, angle: a, owner: id, color: "#ff4444", speed: 10, size: 8, damage: 60, penetrate: true}); } 
                    else { bullets.push({x: p.x, y: p.y, angle: a, owner: id, color: p.color, speed: stats.spd, size: stats.size, damage: stats.dmg, penetrate: stats.pen||false}); }
                    roomRef.child('players/'+id+'/shootAngle').remove(); p.shootAngle = null; 
                }
            }

            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += Math.cos(b.angle)*b.speed; b.y += Math.sin(b.angle)*b.speed;
                if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || checkCollision(b.x, b.y, b.size)) { bullets.splice(i,1); continue; }
                
                for(let id in localPlayers) {
                    let p = localPlayers[id]; let isEnemy = false;
                    if(config.mode === 'ffa') isEnemy = id !== b.owner;
                    else if(config.mode === 'teams') isEnemy = id !== b.owner && localPlayers[b.owner] && localPlayers[b.owner].color !== p.color;
                    else if(config.mode === 'juggernaut') isEnemy = id !== b.owner && localPlayers[b.owner] && (p.isBoss || localPlayers[b.owner].isBoss);

                    if(!p.dead && isEnemy && Math.hypot(b.x-p.x, b.y-p.y) < p.radius + b.size) {
                        if(p.shield) { roomRef.child('players/'+id+'/shield').set(false); if(!b.penetrate) bullets.splice(i,1); }
                        else { 
                            let newHp = p.hp - b.damage;
                            if(newHp <= 0) {
                                roomRef.child('players/'+id).update({dead: true, hp: 0, x:0, y:0}); 
                                roomRef.child('players/'+b.owner+'/score').set((localPlayers[b.owner].score || 0) + 1); 
                                
                                boosters.push({x: p.x, y: p.y, type: 'COIN'}); // DROP DE MONEDA

                                currentExplosions = createExplosion(p.x, p.y, p.color); killData = { killer: localPlayers[b.owner].name, victim: p.name, color: localPlayers[b.owner].color }; 
                                db.ref('hallOfFame/'+localPlayers[b.owner].name).update({ kills: firebase.database.ServerValue.increment(1), color: localPlayers[b.owner].color });
                                setTimeout(() => resetPlayer(id), 4000); 
                            } else { roomRef.child('players/'+id+'/hp').set(newHp); }
                            if(!b.penetrate) bullets.splice(i,1); 
                        }
                    }
                }
            }

            let map = mapList[config.mapIdx] || mapList[1];
            for(let id in localPlayers) {
                let p = localPlayers[id]; if(p.dead) continue;
                let actSpd = p.speedBoost > Date.now() ? config.moveSpeed * 1.5 : config.moveSpeed;
                if(p.isBoss) actSpd *= 0.7; 

                let dx = p.targetX - p.x, dy = p.targetY - p.y, dist = Math.hypot(dx, dy);
                map.hazards.forEach(h => { if(h.type === 'coffee' && Math.hypot(p.x-h.x, p.y-h.y) < h.r) actSpd *= 0.4; if(h.type === 'belt' && p.x>h.x && p.x<h.x+h.w && p.y>h.y && p.y<h.y+h.h) { roomRef.child('players/'+id).update({x: p.x+h.dx, y: p.y+h.dy, targetX: p.x+h.dx, targetY: p.y+h.dy}); } });
                
                if(dist > actSpd) { let nx = p.x + (dx/dist)*actSpd, ny = p.y + (dy/dist)*actSpd; if(!checkCollision(nx, p.y, p.radius)) p.x = nx; if(!checkCollision(p.x, ny, p.radius)) p.y = ny; roomRef.child('players/'+id).update({x: p.x, y: p.y}); }
                
                if(p.x < zoneSize || p.x > canvas.width-zoneSize || p.y < zoneSize || p.y > canvas.height-zoneSize) { 
                    roomRef.child('players/'+id).update({dead: true, hp: 0, x:0, y:0}); boosters.push({x: p.x, y: p.y, type: 'COIN'}); 
                    currentExplosions = createExplosion(p.x, p.y, p.color); killData = { killer: "LA ZONA", victim: p.name, color: "#fff" }; setTimeout(() => resetPlayer(id), 4000); 
                }
                
                for(let bi = boosters.length - 1; bi >= 0; bi--) {
                    let b = boosters[bi];
                    if(Math.hypot(p.x - b.x, p.y - b.y) < p.radius + 15) { 
                        if(b.type === '🛡️') roomRef.child('players/'+id+'/shield').set(true); 
                        else if(b.type === '☕') roomRef.child('players/'+id+'/speedBoost').set(Date.now() + 6000); 
                        else if(b.type === '💊') roomRef.child('players/'+id+'/hp').set(Math.min(p.maxHp, p.hp + 50));
                        else if(b.type === 'COIN') {
                            roomRef.child('players/'+id+'/coins').set((p.coins || 0) + 5);
                            roomRef.child('players/'+id+'/hp').set(Math.min(p.maxHp, p.hp + 15)); // Extra curar un poco al agarrar moneda
                        }
                        boosters.splice(bi, 1); 
                    }
                }
            }
            roomRef.child('state').set({ bullets, boosters, zoneSize, killData, explosions: currentExplosions });
        }

        // ==========================================
        // 8. RENDER LOOP Y DIBUJOS (CAPADO A 30 FPS)
        // ==========================================
        function drawPlayerWeapon(pCtx, w, rad) {
            pCtx.fillStyle = "#fff";
            if(w === 'sniper') pCtx.fillRect(rad-2, -3, 20, 6); else if(w === 'shotgun') { pCtx.fillRect(rad-2, -6, 12, 4); pCtx.fillRect(rad-2, 2, 12, 4); } else if(w === 'mg') { pCtx.fillRect(rad-2, -4, 15, 8); pCtx.fillStyle="#555"; pCtx.fillRect(rad+2, -6, 6, 12); } else if(w === 'boss') { pCtx.fillRect(rad-4, -8, 12, 16); } else pCtx.fillRect(rad-2, -3, 8, 6);
        }

        function gameLoop(timestamp) {
            if(document.getElementById('lobbyOverlay').style.display !== 'none' || !roomRef) { renderReq = requestAnimationFrame(gameLoop); return; }
            if (!timestamp) timestamp = performance.now();
            
            // LIMITADOR A 30 FPS
            if (timestamp - lastDrawTime < 33.3) {
                renderReq = requestAnimationFrame(gameLoop);
                return;
            }
            lastDrawTime = timestamp;
            
            let map = mapList[config.mapIdx] || mapList[1]; 
            document.getElementById('mapName').innerText = map.name;

            if (config.mapIdx === 1 && bgOfficeImg.complete) { ctx.drawImage(bgOfficeImg, 0, 0, canvas.width, canvas.height); } else { ctx.fillStyle = map.bg; ctx.fillRect(0,0,canvas.width,canvas.height); }
            map.hazards.forEach(h => { if(h.type === 'coffee') { ctx.fillStyle = "rgba(78, 52, 46, 0.6)"; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI*2); ctx.fill(); } else if (h.type === 'belt') { ctx.fillStyle = "rgba(100, 100, 100, 0.4)"; ctx.fillRect(h.x, h.y, h.w, h.h); ctx.fillStyle = "rgba(255, 255, 255, 0.2)"; ctx.font="20px Arial"; ctx.fillText("⬇", h.x+10, h.y+h.h/2); } });
            if (config.mapIdx !== 1) { ctx.shadowBlur = 15; ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.fillStyle = map.wall; map.furniture.forEach(f => ctx.fillRect(f.x, f.y, f.w, f.h)); ctx.shadowBlur = 0; }

            let me = localPlayers[myId];
            if(me && !me.dead) {
                let wp = wpStats[me.weapon] || wpStats['pistol'];
                if(isShooting && !mgOverheated && Date.now() - lastShot > wp.cd) { 
                    lastShot = Date.now(); roomRef.child('players/'+myId+'/shootAngle').set(Math.atan2(mouseY - me.y, mouseX - me.x)); 
                    if(me.weapon === 'mg') { mgHeat += 10; if(mgHeat >= 100) { mgOverheated = true; setTimeout(() => { mgHeat = 0; mgOverheated = false; }, 2000); } }
                } else if (!isShooting && me.weapon === 'mg' && mgHeat > 0 && !mgOverheated) { mgHeat -= 1; }
            }

            const kf = document.getElementById('killfeed'); kf.innerHTML = ""; killfeedData = killfeedData.filter(k => k.expire > Date.now()); killfeedData.forEach(k => { let d = document.createElement('div'); d.className = 'kf-item'; d.innerHTML = k.text; kf.appendChild(d); });

            ctx.fillStyle = "rgba(255, 0, 0, 0.1)"; ctx.fillRect(0, 0, canvas.width, zoneSize); ctx.fillRect(0, canvas.height-zoneSize, canvas.width, zoneSize); ctx.fillRect(0, zoneSize, zoneSize, canvas.height-zoneSize*2); ctx.fillRect(canvas.width-zoneSize, zoneSize, zoneSize, canvas.height-zoneSize*2); ctx.strokeStyle = "#ff4444"; ctx.lineWidth = 2; ctx.strokeRect(zoneSize, zoneSize, canvas.width-zoneSize*2, canvas.height-zoneSize*2);
            
            boosters.forEach(b => { 
                if(b.type === 'COIN') {
                    let scale = Math.sin(Date.now() / 150); 
                    let img = scale > 0 ? coinFront : coinBack;
                    let w = 24 * Math.abs(scale); let h = 24; 

                    ctx.shadowBlur = 10; ctx.shadowColor = '#ffcc00';
                    if(img.complete && w > 0.5) { ctx.drawImage(img, b.x - w/2, b.y - h/2, w, h); } 
                    else { ctx.fillStyle = "gold"; ctx.beginPath(); ctx.arc(b.x, b.y, 10 * Math.abs(scale), 0, Math.PI*2); ctx.fill(); }
                    ctx.shadowBlur = 0;
                } else {
                    ctx.shadowBlur = 15; ctx.shadowColor = b.type === '💊' ? '#ff4757' : '#fff'; ctx.fillStyle = "rgba(255, 255, 255, 0.9)"; ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = "#000"; ctx.font = "16px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(b.type, b.x, b.y+1); 
                }
            });
            
            bullets.forEach(b => { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill(); });

            for(let id in localPlayers) {
                let p = localPlayers[id]; if(p.dead) continue;
                if (p.dbX !== undefined && p.dbY !== undefined) { p.x += (p.dbX - p.x) * 0.3; p.y += (p.dbY - p.y) * 0.3; }
                
                let angle = isMobile && isShooting && id === myId ? Math.atan2(mouseY - p.y, mouseX - p.x) : Math.atan2(p.targetY - p.y, p.targetX - p.x);
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(angle);
                if(p.shield) { ctx.beginPath(); ctx.arc(0,0, p.radius+5, 0, Math.PI*2); ctx.strokeStyle = "#00f2ff"; ctx.lineWidth=3; ctx.stroke(); }
                ctx.beginPath(); ctx.arc(0,0, p.radius, 0, Math.PI*2); ctx.fillStyle = p.isBoss ? '#8b0000' : p.color; ctx.fill(); ctx.strokeStyle = "#000"; ctx.lineWidth=2; ctx.stroke();
                drawPlayerWeapon(ctx, p.weapon, p.radius); ctx.restore();
                
                let hpPct = Math.max(0, p.hp / p.maxHp); ctx.fillStyle = "#ff4444"; ctx.fillRect(p.x - 15, p.y - p.radius - 12, 30, 4); ctx.fillStyle = "#2ecc71"; ctx.fillRect(p.x - 15, p.y - p.radius - 12, 30 * hpPct, 4);
                ctx.fillStyle = "#fff"; ctx.font = "bold 11px Arial"; ctx.textAlign = "center"; ctx.fillText(`${p.name}`, p.x, p.y - p.radius - 16);
                
                if(id === myId && p.weapon === 'mg' && mgHeat > 0) { ctx.fillStyle = mgOverheated ? "#ff4444" : "#ffea00"; ctx.fillRect(p.x - 15, p.y + p.radius + 8, 30 * (mgHeat/100), 3); if(mgOverheated) { ctx.font = "9px Arial"; ctx.fillText("TRABADA", p.x, p.y + p.radius + 20); } }
                if(p.react && p.react.exp > Date.now()) { ctx.font = "24px Arial"; ctx.fillText(p.react.emoji, p.x, p.y - p.radius - 30); }
                if(id === myId) { let wp = wpStats[p.weapon] || wpStats['pistol']; let cdRatio = Math.min(1, (Date.now() - lastShot) / wp.cd); if(cdRatio < 1 && !mgOverheated) { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius+10, -Math.PI/2, (-Math.PI/2) + (Math.PI*2 * cdRatio)); ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 2; ctx.stroke(); } }
            }

            particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); if(p.life <= 0) particles.splice(i, 1); });
            ctx.globalAlpha = 1; 

            renderReq = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
